name: likealocal_mobile
description: LikeALocal mobile application for discovering local places and experiences.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_database: ^12.3.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  shimmer: ^3.0.0

  # ── NEW: added for Member 5 features ──────────────────────────────────────
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  workmanager: ^0.9.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
